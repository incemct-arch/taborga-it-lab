.circuit-card{
  position:relative;
  background:linear-gradient(145deg, rgba(14,44,72,.92), rgba(5,14,26,.94));
  border:1px solid rgba(0,212,255,.32)!important;
  box-shadow:0 12px 35px rgba(0,0,0,.28), inset 0 1px 0 rgba(0,212,255,.12);
  overflow:hidden;
}

.circuit-card::before,
.circuit-card::after{
  content:"";
  position:absolute;
  width:34px;
  height:34px;
  pointer-events:none;
  opacity:.75;

.circuit-card::before{
  left:0;
  top:0;

  border-top:2px solid rgba(0,212,255,.7);
  border-top-left-radius:inherit

/* === HERO - BRILLO QUE PULSA === */
.hero-glow{
  animation:heroGlow 2.4s ease-in-out infinite
}

@keyframes heroGlow{
  0%,100%{
    opacity:.65;
    transform:scale(1)
  }

  50%{
    opacity:1;
    transform:scale(1.06)
  }
}

/* === CIRCUITOS - PUNTOS QUE VIAJAN - 3.5s = velocidad === */
.pulse-dot{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:9999px;
  background:#bff8ff;
  box-shadow:0 0 0 4px rgba(0,212,255,.18), 0 0 18px 4px rgba(0,212,255,.75);
  animation:pulseTravel 3.5s linear infinite
}

.pulse-dot.slow{
  animation-duration:5s;
  animation-delay:-4s;
  background:#ffd166;
  box-shadow:0 0 0 4px rgba(255,209,102,.15), 0 0 18px 4px rgba(255,209,102,.55)
}

.pulse-dot.fast{
  animation-duration:3s;
  animation-delay:-1s;
  top:78%;
  left:12%;
  background:#fff;
  box-shadow:0 0 0 4px rgba(255,255,255,.12), 0 0 18px 5px rgba(0,212,255,.8)
}

@keyframes pulseTravel{
  0%{
    left:2%;
    top:18%;
    opacity:0
  }

  8%{
    opacity:1
  }

  42%{
    left:48%;
    top:18%
  }

  58%{
    left:48%;
    top:72%
  }

  92%{
    left:94%;
    top:72%;
    opacity:1
  }

  100%{
    left:98%;
    top:72%;
    opacity:0
  }
}

/* === CIRCUITOS FONDO - NO BORRAR - lineas base === */
.trace{
  stroke:rgba(0,212,255,.90);
  stroke-width:2.6;
  fill:none;
  filter:drop-shadow(0 0 4px rgba(0,212,255,.35))
}

.trace-node{
  fill:#06121f;
  stroke:#7df3ff;
  stroke-width:2.2;
  filter:drop-shadow(0 0 5px rgba(0,212,255,.9))
}

.trace-dot{
  fill:#7df3ff;
  filter:drop-shadow(0 0 5px rgba(0,212,255,.9))
}

/* === CIRCUITOS - LUZ QUE CORRE - 2.6s = velocidad === */
.trace-flow{
  fill:none;
  stroke:#bff8ff;
  stroke-width:4.5;
  stroke-linecap:round;
  stroke-dasharray:70 260;
  animation:traceFlow 2.6s linear infinite;
  filter:drop-shadow(0 0 6px rgba(0,212,255,.9))
}

.trace-flow.delay{
  animation-delay:-1.8s;
  stroke:#ffd166
}

.trace-flow.delay-2{
  animation-delay:-3.4s
}

@keyframes traceFlow{
  to{
    stroke-dashoffset:-860
  }
}

.service-shield{
  position:relative;
  display:grid;
  place-items:center;
  width:88px;
  height:102px;
  flex:none;
  filter:drop-shadow(0 0 14px rgba(0,212,255,.35));
  transition:transform .3s ease, filter .3s ease
}

.group:hover .service-shield{
  transform:translateY(-3px) scale(1.04);
  filter:drop-shadow(0 0 20px rgba(0,212,255,.55))
}

.shield-core{
  position:absolute;
  left:50%;
  top:8px;
  width:5px;
  height:5px;
  border-radius:9999px;
  background:#ffd166;
  box-shadow:0 0 10px 3px rgba(255,209,102,.8);
  transform:translateX(-50%)
}

.hero-frame{
  isolation:isolate
}

.hero-photo{
  transform-origin:center 30%
}

.section-shell{
  position:relative;
  overflow:hidden;
  background:radial-gradient(circle at 12% 8%, rgba(0,212,255,.08), transparent 28%), radial-gradient(circle at 90% 88%, rgba(46,90,123,.28), transparent 30%), linear-gradient(180deg,#050E1A,#081A2E 55%,#050E1A)
}

.reveal{
  opacity:0;
  transform:translateY(24px);
  transition:opacity .7s ease,transform .7s ease
}

.reveal.is-visible{
  opacity:1;
  transform:none
}

@media (prefers-reduced-motion: reduce){
  html{
    scroll-behavior:auto
  }
  .reveal{
    opacity:1;
    transform:none;
    transition:none
  }
  /* Circuitos SIEMPRE animados, aunque el sistema tenga movimiento reducido */
  .trace-flow,.pulse-dot,/* === HERO - BRILLO QUE PULSA === */
.hero-glow{
    animation-play-state:running!important
  }
}
